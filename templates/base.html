{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="{% static 'images/logo.jpg' %}">
    <title>mtaatrack</title>
     

    <style>
      /* Make media and tables fit any screen */
      img, video, iframe { max-width: 100%; height: auto; }
      .table-responsive { overflow-x: auto; }
    </style>
  </head>
  <body>
    {% include "projects/nav.html" %}
 
    <!-- Put all your content inside this container -->
    <div class="container-fluid px-3 px-md-4">
      <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mx-auto">
         
          {% block content %} {% endblock %}
          
        </div>
      </div>
    </div>
{% include "projects/footer.html" %}
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
